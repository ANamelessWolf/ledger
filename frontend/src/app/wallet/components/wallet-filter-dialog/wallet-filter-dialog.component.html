<form [formGroup]="form" class="filter-form">

  <div class="filter-section">
    <label class="filter-label">Status</label>
    <mat-form-field appearance="outline" class="full-width">
      <mat-select formControlName="status">
        <mat-option *ngFor="let opt of statusOptions" [value]="opt.value">
          {{ opt.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="filter-section">
    <label class="filter-label">Currencies</label>
    <app-catalog-item-multi-select
      header=""
      placeholder="All currencies..."
      [items]="data.availableCurrencies"
      [control]="currencyControl">
    </app-catalog-item-multi-select>
  </div>

</form>

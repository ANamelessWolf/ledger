<div class="currency-section">
  <div class="section-header">
    <span class="section-title">Currencies</span>
    <button mat-icon-button matTooltip="Add currency" (click)="openAdd()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="spinner-wrap" *ngIf="isLoading">
    <app-spinner></app-spinner>
  </div>

  <table mat-table [dataSource]="currencies" class="currency-table" *ngIf="!isLoading">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">
        <div class="name-cell">
          <span>{{ c.name }}</span>
          <span class="default-badge" *ngIf="c.isDefault">Default</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef>Symbol</th>
      <td mat-cell *matCellDef="let c">{{ c.symbol }}</td>
    </ng-container>

    <ng-container matColumnDef="conversion">
      <th mat-header-cell *matHeaderCellDef>Conversion</th>
      <td mat-cell *matCellDef="let c">
        <span *ngIf="!c.isDefault">{{ c.conversion }}</span>
        <span *ngIf="c.isDefault" class="default-rate">—</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c">
        <button mat-icon-button [matMenuTriggerFor]="currencyMenu" (click)="$event.stopPropagation()">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #currencyMenu="matMenu">
          <button mat-menu-item (click)="openEdit(c)" [disabled]="c.isDefault">
            <mat-icon>edit</mat-icon>
            <span>Edit</span>
          </button>
          <button mat-menu-item (click)="setDefault(c)" [disabled]="c.isDefault">
            <mat-icon>star</mat-icon>
            <span>Set as default</span>
          </button>
          <button mat-menu-item (click)="deleteCurrency(c)" [disabled]="c.isDefault" class="danger-item">
            <mat-icon>delete</mat-icon>
            <span>Delete</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div class="empty-state" *ngIf="!isLoading && currencies.length === 0">
    <span>No currencies defined</span>
  </div>
</div>

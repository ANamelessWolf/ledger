<div class="table-wrap mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Wallet</th>
      <td mat-cell *matCellDef="let g" class="name-cell">{{ g.name }}</td>
    </ng-container>

    <!-- Currencies -->
    <ng-container matColumnDef="currencies">
      <th mat-header-cell *matHeaderCellDef>Currencies</th>
      <td mat-cell *matCellDef="let g">
        <span class="currency-chip" *ngFor="let c of g.currencies">{{ c }}</span>
        <span *ngIf="!g.currencies?.length" class="no-data">—</span>
      </td>
    </ng-container>

    <!-- Wallet count -->
    <ng-container matColumnDef="wallets">
      <th mat-header-cell *matHeaderCellDef>Wallets</th>
      <td mat-cell *matCellDef="let g">
        <span class="count-badge">{{ g.walletCount }}</span>
      </td>
    </ng-container>

    <!-- Active -->
    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Active</th>
      <td mat-cell *matCellDef="let g" class="active-cell">
        <mat-slide-toggle
          color="primary"
          [checked]="g.isActive === 1"
          (change)="toggleActive(g)">
        </mat-slide-toggle>
      </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let g" class="actions-cell">
        <button type="button" mat-icon-button [matMenuTriggerFor]="groupMenu">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #groupMenu="matMenu">
          <button type="button" mat-menu-item (click)="openEditGroup(g)">
            <mat-icon>edit</mat-icon><span>Edit</span>
          </button>
          <button type="button" mat-menu-item (click)="openManageCurrencies(g)">
            <mat-icon>tune</mat-icon><span>Manage currencies</span>
          </button>
          <mat-divider></mat-divider>
          <button type="button" mat-menu-item class="danger-item" (click)="deleteGroup(g)">
            <mat-icon>delete</mat-icon><span>Delete</span>
          </button>
        </mat-menu>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;" class="group-row"></tr>

  </table>

  <div class="empty-state" *ngIf="groups.length === 0">
    <mat-icon>account_balance_wallet</mat-icon>
    <p>No wallet yet. Click + to create one.</p>
  </div>
</div>

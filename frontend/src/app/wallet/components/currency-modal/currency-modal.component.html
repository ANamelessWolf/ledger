<form [formGroup]="form" class="modal-form">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" placeholder="e.g. US Dollar" maxlength="20" />
    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Symbol</mat-label>
    <input matInput formControlName="symbol" placeholder="e.g. USD" maxlength="3" />
    <mat-error *ngIf="form.get('symbol')?.hasError('required')">Symbol is required</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Conversion Factor</mat-label>
    <input matInput formControlName="conversion" type="number" step="0.0001" placeholder="e.g. 17.5" />
    <mat-hint>Conversion relative to the default currency</mat-hint>
    <mat-error *ngIf="form.get('conversion')?.hasError('required')">Conversion is required</mat-error>
    <mat-error *ngIf="form.get('conversion')?.hasError('min')">Must be greater than 0</mat-error>
  </mat-form-field>
</form>

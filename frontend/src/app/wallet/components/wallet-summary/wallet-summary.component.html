<div class="summary-cards">
  <mat-card class="stat-card">
    <mat-card-content>
      <div class="card-inner">
        <mat-icon class="card-icon groups-icon">folder_special</mat-icon>
        <div class="card-data">
          <span class="card-label">Wallets</span>
          <span class="card-value">{{ summary.groupCount }}</span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-content>
      <div class="card-inner">
        <mat-icon class="card-icon currency-icon">currency_exchange</mat-icon>
        <div class="card-data">
          <span class="card-label">Currencies</span>
          <span class="card-value">{{ summary.currencyCount }}</span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

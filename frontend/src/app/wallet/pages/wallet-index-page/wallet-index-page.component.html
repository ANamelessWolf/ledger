<app-page-layout
  title="Wallets"
  [hasFilter]="true"
  [hasWidget]="true"
  (onSearch)="onSearch($event)"
  (openFilter)="onOpenFilter()"
  (add)="onAddRequested()">

  <div widget>
    <app-wallet-summary [summary]="summary"></app-wallet-summary>
  </div>

  <div main class="main-content">
    <mat-tab-group animationDuration="150ms" class="wallet-tabs" (selectedIndexChange)="activeTab = $event">

      <mat-tab label="Wallet Groups">
        <div class="tab-content">
          <app-wallet-group-table
            [groups]="filteredGroups"
            (refresh)="loadAll()">
          </app-wallet-group-table>
        </div>
      </mat-tab>

      <mat-tab label="Currencies">
        <div class="tab-content">
          <app-currency-list></app-currency-list>
        </div>
      </mat-tab>

    </mat-tab-group>
  </div>

</app-page-layout>

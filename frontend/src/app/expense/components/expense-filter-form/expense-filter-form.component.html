<div class="filter-form" *ngIf="filterForm" [formGroup]="filterForm">

  <!-- Period -->
  <div class="form-section">
    <span class="section-label">Period</span>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>From</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="start" placeholder="Start date" />
        <mat-datepicker-toggle matSuffix [for]="startPicker" />
        <mat-datepicker #startPicker />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="end" placeholder="End date" />
        <mat-datepicker-toggle matSuffix [for]="endPicker" />
        <mat-datepicker #endPicker />
      </mat-form-field>
    </div>
  </div>

  <!-- Amount range -->
  <div class="form-section">
    <span class="section-label">Amount Range</span>
    <app-range-slider
      #expenseRange
      header="Expense Range"
      [matSliderStartThumb]="0"
      [matSliderEndThumb]="20000"
      [control]="expenseRangeControl"
    />
  </div>

  <!-- Wallets -->
  <div class="form-section" *ngIf="visibility.enableWallet">
    <span class="section-label">Wallet</span>
    <app-catalog-item-multi-select
      #walletMultiSelect
      header="Wallets"
      [items]="data.options.wallets"
      [control]="walletControl"
    />
  </div>

  <!-- Category -->
  <div class="form-section" *ngIf="visibility.enableExpenseTypes || visibility.enableVendors">
    <span class="section-label">Category</span>
    <app-expense-type-multi-select
      *ngIf="visibility.enableExpenseTypes"
      #expenseTypeMultiSelect
      header="Expense Type"
      [items]="data.options.expenseTypes"
      [control]="expenseTypeControl"
    />
    <app-catalog-item-multi-select
      *ngIf="visibility.enableVendors"
      #vendorMultiSelect
      header="Vendors"
      [items]="data.options.vendors"
      [control]="vendorControl"
    />
  </div>

</div>

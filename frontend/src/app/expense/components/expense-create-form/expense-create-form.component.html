<div class="edit-form" *ngIf="form" [formGroup]="form">

  <!-- Payment -->
  <div class="form-section">
    <span class="section-label">Payment</span>

    <div class="form-row">
      <div class="wallet-field-wrapper">
        <app-wallet-picker [control]="walletControl" />
        <div *ngIf="walletMissing" class="field-error">Wallet is required.</div>
      </div>
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Total</mat-label>
        <input
          matInput
          appCurrencyInput
          formControlName="total"
          inputmode="decimal"
          aria-label="Total"
          required
        />
        <mat-error *ngIf="total?.errors?.['required']">Total is required.</mat-error>
        <mat-error *ngIf="total?.errors?.['min']">Must be greater than 0.</mat-error>
      </mat-form-field>
    </div>
  </div>

  <!-- Category -->
  <div class="form-section">
    <span class="section-label">Category</span>
    <div class="form-row">
      <div class="select-wrapper">
        <app-expense-type-select
          header="Type"
          [items]="data.options.expenseTypes"
          [control]="expenseTypeControl"
        />
        <div *ngIf="typeMissing" class="field-error">Expense type is required.</div>
      </div>
      <div class="select-wrapper">
        <app-catalog-item-select
          header="Vendor"
          [items]="data.options.vendors"
          [control]="vendorControl"
        />
        <div *ngIf="vendorMissing" class="field-error">Vendor is required.</div>
      </div>
    </div>
  </div>

  <!-- Details -->
  <div class="form-section">
    <span class="section-label">Details</span>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Expense Date</mat-label>
        <input
          matInput
          [matDatepicker]="picker"
          formControlName="expenseDate"
          placeholder="Choose a date"
          required
        />
        <mat-datepicker-toggle matSuffix [for]="picker" />
        <mat-datepicker #picker />
        <mat-error *ngIf="expenseDate?.errors?.['required']">Date is required.</mat-error>
      </mat-form-field>
    </div>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="3"
          placeholder="Enter a description"
          required
        ></textarea>
        <mat-error *ngIf="description?.errors?.['required']">Description is required.</mat-error>
      </mat-form-field>
    </div>
  </div>

</div>

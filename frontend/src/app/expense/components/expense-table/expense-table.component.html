<div class="table-wrapper">
  <h1 class="table-header-h1">{{ header }}</h1>
  <div class="mat-elevation-z2 table-card">
    <div class="table-scroll-area">
      <table
        mat-table
        [dataSource]="expenses"
        matSort
        (matSortChange)="sortChanged($event)"
      >
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
          <td mat-cell *matCellDef="let row">
            <span class="row-id">{{ row.id }}</span>
          </td>
        </ng-container>

        <!-- Wallet Column -->
        <ng-container matColumnDef="wallet">
          <th mat-header-cell *matHeaderCellDef>Wallet</th>
          <td mat-cell *matCellDef="let row">
            <span class="wallet-badge">{{ row.wallet }}</span>
          </td>
        </ng-container>

        <!-- Expense Column -->
        <ng-container matColumnDef="expense">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Expense</th>
          <td mat-cell *matCellDef="let row">
            <div class="expense-cell">
              <div class="expense-icon-badge">
                <app-ledger-icon [iconName]="row.expenseIcon" iconSize="1x" />
              </div>
              <div class="expense-info">
                <span class="expense-description" [innerHTML]="row.description"></span>
                <span class="expense-meta">
                  <span class="expense-vendor">{{ row.vendor }}</span>
                  <span class="meta-dot">·</span>
                  <span class="expense-type">{{ row.expenseType }}</span>
                </span>
              </div>
            </div>
          </td>
        </ng-container>

        <!-- Total Column -->
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
          <td mat-cell *matCellDef="let row">
            <span class="amount" [class.amount-expense]="row.value > 0" [class.amount-income]="row.value <= 0">
              {{ row.total }}
            </span>
          </td>
        </ng-container>

        <!-- Buy Date Column -->
        <ng-container matColumnDef="buyDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
          <td mat-cell *matCellDef="let row">
            <span class="date-text">{{ row.buyDate | date:'MMM d, y' }}</span>
          </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef aria-label="Actions"></th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button class="action-btn" [matMenuTriggerFor]="menu" aria-label="Row actions">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="editExpense(row.id, row)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item class="delete-item" (click)="deleteExpense(row)">
                <mat-icon>delete_outline</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="expense-row"></tr>
      </table>
    </div>
    <mat-paginator
      [length]="totalItems"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="pageChanged($event)"
    />
  </div>
</div>

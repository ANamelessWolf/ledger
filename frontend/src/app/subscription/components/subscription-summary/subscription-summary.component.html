<div class="summary-widget">
  <div class="summary-stats">
    <div class="stat-card stat-monthly">
      <span class="stat-label">Monthly Total</span>
      <span class="stat-value">${{ (summary?.monthlyTotal ?? 0) | number:'1.2-2' }}</span>
    </div>
    <div class="stat-card stat-annual">
      <span class="stat-label">Annual Total</span>
      <span class="stat-value">${{ (summary?.annualTotal ?? 0) | number:'1.2-2' }}</span>
    </div>
  </div>

  <div class="period-selector">
    <mat-form-field appearance="outline" class="period-field">
      <mat-label>Month</mat-label>
      <mat-select [(ngModel)]="selectedMonth" (ngModelChange)="onPeriodChange()">
        <mat-option *ngFor="let m of months" [value]="m.value">{{ m.label }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="period-field">
      <mat-label>Year</mat-label>
      <mat-select [(ngModel)]="selectedYear" (ngModelChange)="onPeriodChange()">
        <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</div>

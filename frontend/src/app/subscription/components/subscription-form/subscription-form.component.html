<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="subscription-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" maxlength="40" placeholder="e.g. Netflix" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <div class="row-two">
      <mat-form-field appearance="outline">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" min="0.01" step="0.01" placeholder="0.00" />
        <mat-error *ngIf="form.get('price')?.hasError('required')">Price is required</mat-error>
        <mat-error *ngIf="form.get('price')?.hasError('min')">Must be greater than 0</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Charge Day</mat-label>
        <mat-select formControlName="chargeDay">
          <mat-option *ngFor="let day of chargeDays" [value]="day">{{ day }}</mat-option>
        </mat-select>
        <mat-error *ngIf="form.get('chargeDay')?.hasError('required')">Charge day is required</mat-error>
      </mat-form-field>
    </div>

    <app-wallet-picker
      [control]="walletControl"
      [initialGroupId]="data.subscription?.walletGroupId ?? null"
      [initialCurrencyId]="data.subscription?.currencyId ?? null"
      (walletChanged)="onWalletChanged($event)">
    </app-wallet-picker>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Payment Frequency</mat-label>
      <mat-select formControlName="paymentFrequencyId">
        <mat-option *ngFor="let f of data.paymentFrequencies" [value]="f.id">{{ f.name }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('paymentFrequencyId')?.hasError('required')">Frequency is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Last Payment Date</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="lastPaymentDate" placeholder="MM/DD/YYYY" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <mat-error *ngIf="form.get('lastPaymentDate')?.hasError('required')">Date is required</mat-error>
    </mat-form-field>

    <div class="toggle-row">
      <mat-slide-toggle formControlName="active" color="primary">Active</mat-slide-toggle>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">Cancel</button>
  <button type="button" mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ isEdit ? 'Update' : 'Create' }}
  </button>
</mat-dialog-actions>

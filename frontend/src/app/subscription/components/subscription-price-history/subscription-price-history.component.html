<div class="price-history-content">
  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <div *ngIf="!loading && chartData.labels.length === 0" class="empty-state">
    <p>No payment history found for this subscription.</p>
  </div>

  <app-line-chart
    *ngIf="!loading && chartData.labels.length > 0"
    [data]="chartData"
    [chartHeight]="300">
  </app-line-chart>
</div>

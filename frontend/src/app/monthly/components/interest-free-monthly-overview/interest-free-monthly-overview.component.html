<div class="overview-stats">

  <div class="stat-card stat-balance">
    <span class="stat-label">Current Balance</span>
    <span class="stat-value">{{ intFreeMo.current | currencyFormat }}</span>
  </div>

  <div class="stat-card stat-monthly">
    <span class="stat-label">Monthly Payment</span>
    <span class="stat-value">{{ intFreeMo.monthly | currencyFormat }}</span>
  </div>

  <div class="stat-card stat-total">
    <span class="stat-label">Total Payment</span>
    <span class="stat-value">{{ intFreeMo.total | currencyFormat }}</span>
  </div>

</div>

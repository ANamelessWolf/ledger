<form [formGroup]="form" class="filter-form">

  <div class="form-section">
    <span class="section-label">Estado</span>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-section">
    <span class="section-label">Rango de fechas</span>
    <div class="date-row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="flex-field">
        <mat-label>Mes inicio</mat-label>
        <mat-select formControlName="fromMonth">
          <mat-option *ngFor="let m of months" [value]="m.value">{{ m.label }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="year-field">
        <mat-label>Año inicio</mat-label>
        <mat-select formControlName="fromYear">
          <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="date-row">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="flex-field">
        <mat-label>Mes fin</mat-label>
        <mat-select formControlName="toMonth">
          <mat-option *ngFor="let m of months" [value]="m.value">{{ m.label }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="year-field">
        <mat-label>Año fin</mat-label>
        <mat-select formControlName="toYear">
          <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="form-section">
    <span class="section-label">Opciones</span>
    <mat-checkbox formControlName="showPaid">Mostrar completamente pagados</mat-checkbox>
  </div>

  <div class="form-section">
    <span class="section-label">Wallet group</span>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full-width">
      <mat-label>Wallet group</mat-label>
      <mat-select formControlName="walletGroupId">
        <mat-option [value]="null">Todos</mat-option>
        <mat-option *ngFor="let w of data.walletGroups" [value]="w.id">{{ w.name }}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

</form>

<app-page-layout
  [title]="'Interest-free Installments'"
  [hasFilter]="true"
  [hasWidget]="true"
  (onSearch)="onSearch($event)"
  (add)="addWallet()"
  (openFilter)="openFilter()">

  <!-- ── Widget: overview + chart + summary ──────────────── -->
  <div widget class="monoint-widgets">

    <div class="widget-top">
      <app-interest-free-monthly-overview [intFreeMo]="overview" class="widget-overview" />
      <app-interest-free-credit-card-pie-chart [cards]="cards" class="widget-chart" />
    </div>

    <app-interest-free-summary [data]="summaryChartData" />

  </div>

  <!-- ── Main: installments table ────────────────────────── -->
  <div main class="main-content">
    <app-interest-free-details
      [installments]="installments"
      [statusFilter]="activeFilter.status"
      [showPaid]="activeFilter.showPaid"
      (refreshRequest)="loadInstallments()"
    />
  </div>

</app-page-layout>
